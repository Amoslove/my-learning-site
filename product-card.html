<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
  />
  <link rel="stylesheet" href="../style.css" />
    <title>product card</title>
</head>
<body class="product-card-body">

    <!-- product card starts here -->
     <div class="product-card">
        <img src="images/web-1738159_1280.jpg" alt="product image" class="product-image" />

        <!-- product info starts here -->
         <div class="product-info">
            <div class="product-title">
                Amazing Product
            </div>
            <p class="product-price">$99.99</p>
            <p class="product-discription">This is an amazing product with great features and benefits. </p> <button class="btn-add-to-cart">
                <i class="fas fa-shopping-cart"></i> Add to Cart
            </button>
           
         </div>
         <div class="discount-tag">20% OFF</div>
        
     </div>
    
    
</body>
</html>
